name: Android CI and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon lintDebug

      - name: Build optimized installable ABI APKs
        run: gradle --no-daemon assembleDirect

      - name: Build release AAB
        run: gradle --no-daemon bundleRelease

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            src="$(find app/build/outputs/apk/direct -type f -name "*${abi}*direct*.apk" | head -1)"
            test -n "$src"
            cp "$src" "dist/YRB-v1.9.0-${abi}.apk"
          done

          cp app/build/outputs/bundle/release/app-release.aab dist/YRB-v1.9.0-release-unsigned.aab
          sha256sum dist/* > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YRB-v1.9.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.9.0 \
            --target "$GITHUB_SHA" \
            --title "YRB by Apoorv v1.9.0" \
            --notes "Performance release: reuses the first yt-dlp inspection JSON for downloads via --load-info-json, removes forced updater/retry work from the interactive inspection path, keeps background updates out of startup latency, and preserves the runtime-safe ABI-specific APK packaging." \
            dist/YRB-v1.9.0-arm64-v8a.apk \
            dist/YRB-v1.9.0-armeabi-v7a.apk \
            dist/YRB-v1.9.0-x86.apk \
            dist/YRB-v1.9.0-x86_64.apk \
            dist/YRB-v1.9.0-release-unsigned.aab \
            dist/SHA256SUMS.txt
