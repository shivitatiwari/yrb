name: Android CI and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon lintDebug

      - name: Build installable APK
        run: gradle --no-daemon assembleDebug

      - name: Build release AAB
        run: gradle --no-daemon bundleRelease

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Yrb-v1.0.0-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/Yrb-v1.0.0-release-unsigned.aab
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yrb-v1.0.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0             --target "$GITHUB_SHA"             --title "Yrb v1.0.0"             --notes "Native Android YouTube downloader. yt-dlp and FFmpeg run on-device. Available resolutions are detected before download. Includes download history, Downloads/Yrb output, foreground progress notifications, cancellation, and tap-to-open completion notifications. The APK is debug-signed and installable. The AAB is unsigned because no production signing secret is stored in the repository."             dist/Yrb-v1.0.0-debug.apk             dist/Yrb-v1.0.0-release-unsigned.aab             dist/SHA256SUMS.txt
