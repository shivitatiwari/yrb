name: Android CI and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon lintDebug

      - name: Build installable APK
        run: gradle --no-daemon assembleDebug

      - name: Build release AAB
        run: gradle --no-daemon bundleRelease

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Yrb-v1.1.0-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/Yrb-v1.1.0-release-unsigned.aab
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yrb-v1.1.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0             --target "$GITHUB_SHA"             --title "Yrb v1.1.0"             --notes "Yrb v1.1.0 refreshes yt-dlp on-device, adds live download state with speed and ETA, shows estimated file sizes before download, introduces a dedicated downloading screen, keeps active jobs visible in History, isolates partial files, improves error messages, and refreshes the Material 3 UI. The APK is debug-signed and installable. The AAB is unsigned because no production signing secret is stored in the repository."             dist/Yrb-v1.1.0-debug.apk             dist/Yrb-v1.1.0-release-unsigned.aab             dist/SHA256SUMS.txt
